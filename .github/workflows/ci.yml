# Every push is built and tested, and a tag is turned into signed APKs.
#
# The Gradle wrapper is not in the repository, so the runner installs Gradle itself. The
# release key never is either: it arrives as a base64 secret and is written to a file the
# build reads through TAPLEX_KEYSTORE.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      # The renders in docs/model come from these tests, so a screen that changed without
      # its picture being looked at again fails here.
      - run: gradle :app:testDebugUnitTest --console=plain
      - run: gradle :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAPLEX_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APKs
        env:
          TAPLEX_KEYSTORE: ${{ runner.temp }}/release.keystore
          TAPLEX_STORE_PASSWORD: ${{ secrets.TAPLEX_STORE_PASSWORD }}
          TAPLEX_KEY_ALIAS: ${{ secrets.TAPLEX_KEY_ALIAS }}
          TAPLEX_KEY_PASSWORD: ${{ secrets.TAPLEX_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --console=plain
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
